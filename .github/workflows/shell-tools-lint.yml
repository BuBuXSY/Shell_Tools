name: 🧪 Shell Tools Lint

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: ✅ Shell / Userscript Self Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 📦 Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bats shellcheck

      - name: 📦 Install macOS test dependencies
        if: runner.os == 'macOS'
        run: |
          brew install bash bats shellcheck coreutils
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: 🧪 Run repository self check
        run: |
          bash --version | head -1
          ./shell_tools_lint.sh

      - name: 🔎 Check diff whitespace
        run: git diff --check
