name: 🧪 Shell Tools Lint

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: ✅ Shell / Userscript Self Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 📦 Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bats shellcheck

      - name: 🧪 Run repository self check
        run: ./shell_tools_lint.sh
