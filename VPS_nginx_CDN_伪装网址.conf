# ====================================================
# 🌐 VPS Nginx CDN 伪装与反向代理模板
# 功能：提供 HTTPS 伪装站、WebSocket 分流和 HTTP 到 HTTPS 跳转
# By: BuBuXSY
# Version: 2026-07-11
#
# 使用前请替换：
#   1. worker 用户（Debian 包安装通常使用 www-data）
#   2. example.com 和证书路径
#   3. camouflage_backend 中的伪装站域名
#   4. xray_backend / xui_backend 的本地端口与分流路径
# ====================================================

user nginx;
worker_processes auto;
pid /run/nginx.pid;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # proxy_pass 使用变量时需要显式解析器，可按服务器网络环境替换。
    resolver 223.5.5.5 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream xray_backend {
        server 127.0.0.1:10000;
        keepalive 16;
    }

    upstream xui_backend {
        server 127.0.0.1:9999;
        keepalive 8;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name example.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
            default_type text/plain;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name example.com;

        ssl_certificate /etc/nginx/ssl/example.com.fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/example.com.key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # 伪装站。如需更换目标，请同时修改 proxy_pass、proxy_ssl_name、Host 和 sub_filter。
        location / {
            set $camouflage_host www.juneyaoair.com;
            proxy_pass https://$camouflage_host;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name $camouflage_host;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            # 非 Debian/Ubuntu 系统请替换为本机 CA bundle 路径。
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_redirect off;

            proxy_set_header Host $camouflage_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Accept-Language "zh-CN,zh;q=0.9";

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            sub_filter_once off;
            sub_filter_types text/css application/javascript;
            sub_filter $camouflage_host $server_name;
        }

        # WebSocket 分流路径。后端若要求保留路径，请保持 proxy_pass 末尾不带斜杠。
        location /ray {
            proxy_pass http://xray_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /xui {
            proxy_pass http://xui_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
